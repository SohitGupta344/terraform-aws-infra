name: Terraform AWS Infrastructure

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: environments/dev
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:

  terraform_plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4
              # 2. Debug GitHub OIDC token claims
      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)

          python3 - "$PAYLOAD" <<'PY'
          import sys
          import json
          import base64

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          data = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          print("OIDC Claims:")
          print("sub              =", data.get("sub"))
          print("aud              =", data.get("aud"))
          print("repository       =", data.get("repository"))
          print("repository_id    =", data.get("repository_id"))
          print("repository_owner =", data.get("repository_owner"))
          print("owner_id         =", data.get("repository_owner_id"))
          print("ref              =", data.get("ref"))
          print("event_name       =", data.get("event_name"))
          PY

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::847324761508:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      # 3. Verify AWS authentication
      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # 5. Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # 6. Terraform Format Check
      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      # 7. Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -input=false

      # 9. Upload exact Terraform plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


  terraform_apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform_plan

    # Apply only on direct push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::847324761508:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      # 3. Verify AWS authentication
      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # 5. Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # 6. Download exact plan generated by Terraform Plan job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      # 7. Apply exact Terraform plan
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan